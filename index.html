<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>r0ntflix - Personal Movie/TV App</title>
  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="preconnect" href="https://viduki.net" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎬 r0ntflix</h1>

    <!-- Search Area -->
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Search for movies or TV shows..." />
      <button id="searchBtn">Search</button>
    </div>

    <!-- API Selector -->
    <div class="api-selector">
      <label for="apiSelect">Viduki API:</label>
      <select id="apiSelect">
        <option value="1">API 1 (Multi Server)</option>
        <option value="2">API 2 (Multi Language)</option>
        <option value="3">API 3 (Multi Embeds)</option>
        <option value="4">API 4 (Premium Embeds)</option>
      </select>
    </div>

    <!-- Continue Watching -->
    <div id="continueSection" class="continue-section" style="display:none;">
      <h2 class="continue-title">Continue Watching</h2>
      <div id="continueContainer" class="continue-grid"></div>
    </div>

    <!-- Home Recommendations -->
    <div id="recommendations" class="recommendations"></div>

    <!-- Results Grid -->
    <div id="resultsContainer" class="results-grid"></div>

    <!-- Load More -->
    <div id="loadMoreWrap" class="load-more-wrap" style="display:none;">
      <button id="loadMoreBtn" class="load-more-btn">Load More</button>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="info-msg">Ready. Search for something!</div>
  </div>

  <!-- ===== POPUP PLAYER (Fullscreen overlay) ===== -->
  <div id="playerPopup" class="player-popup">
    <div class="player-popup-content">
      <div class="player-popup-header">
        <span id="playerTitle" class="player-title">Now Playing</span>
        <button id="closePlayer" class="player-close-btn">✕</button>
      </div>
      <div class="player-wrapper">
        <iframe id="playerIframe" allowfullscreen></iframe>
      </div>
      <div id="playerMeta" class="player-meta" style="display:none;">
        <span id="playerRating" class="player-rating"></span>
        <span id="playerRuntime" class="player-runtime"></span>
      </div>
      <div class="player-controls">
        <button id="popupApiPrev" class="popup-api-btn">◄ Prev API</button>
        <span id="popupApiInfo" class="popup-api-info">API 1</span>
        <button id="popupApiNext" class="popup-api-btn">Next API ►</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL FOR TV SHOW EPISODE SELECTION ===== -->
  <div id="episodeModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="modalBody">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="tmdb.js"></script>
  <script src="ui.js"></script>
  <script src="continue.js"></script>
  <script src="player.js"></script>
  <script src="episodes.js"></script>
  <script src="search.js"></script>
  <script src="recommendations.js"></script>
  <script src="app.js"></script>
</body>
</html>
